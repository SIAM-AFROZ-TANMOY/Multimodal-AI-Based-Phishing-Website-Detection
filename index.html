
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Demo Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      padding: 14px 20px;
      text-align: center;
      background: #151515;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .header p {
      color: #bbbbbb;
      font-size: 14px;
    }

    .player-container {
      width: 100%;
      height: calc(100vh - 100px);
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .footer {
      text-align: center;
      padding: 10px;
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 18px;
      }

      .player-container {
        height: calc(100vh - 90px);
        padding: 0;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Project Demonstration</h1>
    <p>Project Demo Video</p>
  </header>

  <main class="player-container">
    <video
      id="projectVideo"
      controls
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="project-demo.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
  </main>

  <footer class="footer">
    Project Demo
  </footer>

  <script>
    const video = document.getElementById("projectVideo");

    video.play().catch(() => {
      // If autoplay is blocked, the viewer can press Play.
    });
  </script>
</body>
</html>
