
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Demonstration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 16px 12px;
            background: #151515;
        }

        .header h1 {
            font-size: clamp(20px, 3vw, 30px);
            margin-bottom: 6px;
        }

        .header p {
            color: #bbbbbb;
            font-size: 14px;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 100px);
            height: calc(100dvh - 100px);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .sound-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 24px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px #00000080;
        }

        .sound-button:hover {
            background: #1d4ed8;
        }

        .sound-button.hidden {
            display: none;
        }

        .footer {
            text-align: center;
            padding: 10px;
            color: #999999;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 12px 8px;
            }

            .player-container {
                height: calc(100vh - 85px);
                height: calc(100dvh - 85px);
                min-height: 250px;
                padding: 0;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Project Demonstration</h1>
        <p>Project Demo Video</p>
    </header>

    <main class="player-container">

        <video
            id="projectVideo"
            controls
            autoplay
            playsinline
            preload="auto"
        >
            <source
                src="project_demo.mp4"
                type="video/mp4"
            >

            Your browser does not support HTML video.
        </video>

        <button
            id="soundButton"
            class="sound-button"
            type="button"
        >
            ▶ Play with Sound
        </button>

    </main>

    <footer class="footer">
        Project Demo
    </footer>

    <script>
        const video = document.getElementById("projectVideo");
        const soundButton = document.getElementById("soundButton");

        // Try autoplay with sound.
        video.muted = false;
        video.volume = 1;

        video.play()
            .then(() => {
                soundButton.classList.add("hidden");
            })
            .catch(() => {
                // If autoplay is blocked, show the play button.
                soundButton.classList.remove("hidden");
            });

        // A user click allows the browser to start playback with sound.
        soundButton.addEventListener("click", async () => {
            video.muted = false;
            video.volume = 1;

            try {
                await video.play();
                soundButton.classList.add("hidden");
            } catch (error) {
                soundButton.textContent = "Please press Play on the video";
            }
        });

        // Hide the button when the video starts playing.
        video.addEventListener("playing", () => {
            if (!video.muted) {
                soundButton.classList.add("hidden");
            }
        });

        // Show the button if playback is paused before starting.
        video.addEventListener("pause", () => {
            if (video.currentTime === 0) {
                soundButton.classList.remove("hidden");
            }
        });
    </script>

</body>
</html>
